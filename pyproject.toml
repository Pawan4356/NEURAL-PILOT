[project]
name = "agentic-automl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pawan4356", email = "pawankumar27112005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.27.0",
    "jinja2>=3.1.6",
    "numpy<2.5",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "uvicorn[standard]>=0.52.1",
    "xgboost>=3.4.0",
]

[project.scripts]
agentic-automl = "agentic_automl:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
